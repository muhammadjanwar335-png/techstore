<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Kategori Produk - TechStore Admin</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>

<div class="admin-wrapper">
    <div id="adminSidebarContainer"></div>

    <div class="admin-main">
        <div id="adminTopbarContainer"></div>

        <main class="admin-content">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
                <div>
                    <h3 class="fw-bold mb-1"><i class="bi bi-tags text-primary me-2"></i>Kategori Produk</h3>
                    <p class="text-muted small mb-0">Kelola kelompok aksesoris komputer (Keyboard, Mouse, Headset, Monitor, dll).</p>
                </div>
                <div>
                    <button type="button" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
                        <i class="bi bi-plus-lg me-1"></i>Tambah Kategori Baru
                    </button>
                </div>
            </div>

            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="table-responsive">
                    <table class="table table-custom align-middle mb-0">
                        <thead>
                            <tr>
                                <th style="width: 50px;">ID</th>
                                <th style="width: 60px;">Ikon</th>
                                <th>Nama Kategori</th>
                                <th>Slug URL</th>
                                <th>Deskripsi</th>
                                <th>Jumlah Produk</th>
                                <th class="text-end" style="width: 120px;">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="categoryTableBody">
                            <!-- Diisi otomatis oleh JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Modal Tambah Kategori -->
<div class="modal fade" id="addCategoryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 border-0 shadow-lg">
            <div class="modal-header border-bottom p-4">
                <h5 class="modal-title fw-bold"><i class="bi bi-tag-fill text-primary me-2"></i>Tambah Kategori Produk</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="addCatForm">
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Nama Kategori</label>
                        <input type="text" id="addCatName" class="form-control" placeholder="Contoh: Graphic Tablet" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Icon Bootstrap</label>
                        <input type="text" id="addCatIcon" class="form-control" value="bi-tag" placeholder="bi-keyboard, bi-mouse" required>
                        <small class="text-muted" style="font-size: 0.72rem;">Gunakan class ikon dari Bootstrap Icons.</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Deskripsi Singkat</label>
                        <textarea id="addCatDesc" class="form-control" rows="3" placeholder="Penjelasan singkat kategori..."></textarea>
                    </div>
                </div>
                <div class="modal-footer border-top p-3">
                    <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Batal</button>
                    <button type="submit" class="btn btn-primary fw-bold">Simpan Kategori</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal Edit Kategori -->
<div class="modal fade" id="editCategoryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 border-0 shadow-lg">
            <div class="modal-header border-bottom p-4">
                <h5 class="modal-title fw-bold"><i class="bi bi-pencil-square text-primary me-2"></i>Edit Kategori</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="editCatForm">
                <input type="hidden" id="editCatId">
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Nama Kategori</label>
                        <input type="text" id="editCatName" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Icon Bootstrap</label>
                        <input type="text" id="editCatIcon" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Deskripsi</label>
                        <textarea id="editCatDesc" class="form-control" rows="3"></textarea>
                    </div>
                </div>
                <div class="modal-footer border-top p-3">
                    <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Batal</button>
                    <button type="submit" class="btn btn-primary fw-bold">Simpan Perubahan</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/db.js"></script>

<script>
let editModalInstance = null;
let addModalInstance = null;

document.addEventListener('DOMContentLoaded', function () {
    const admin = TechDB.requireAuth('admin', '../../auth/login.html');
    if (!admin) return;

    TechDB.renderAdminSidebar('adminSidebarContainer', 'categories', '../../');
    TechDB.renderAdminTopbar('adminTopbarContainer', '../../');

    editModalInstance = new bootstrap.Modal(document.getElementById('editCategoryModal'));
    addModalInstance = new bootstrap.Modal(document.getElementById('addCategoryModal'));

    renderCategories();

    // Submit Tambah Kategori
    document.getElementById('addCatForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const name = document.getElementById('addCatName').value.trim();
        const icon = document.getElementById('addCatIcon').value.trim();
        const description = document.getElementById('addCatDesc').value.trim();

        TechDB.addCategory({ name, icon, description });
        addModalInstance.hide();
        document.getElementById('addCatForm').reset();
        alert('Kategori berhasil ditambahkan!');
        renderCategories();
    });

    // Submit Edit Kategori
    document.getElementById('editCatForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const id = parseInt(document.getElementById('editCatId').value);
        const name = document.getElementById('editCatName').value.trim();
        const icon = document.getElementById('editCatIcon').value.trim();
        const description = document.getElementById('editCatDesc').value.trim();

        TechDB.updateCategory(id, { name, icon, description });
        editModalInstance.hide();
        alert('Kategori berhasil diperbarui!');
        renderCategories();
    });
});

function renderCategories() {
    const categories = TechDB.getCategories();
    const products = TechDB.getProducts();
    const tbody = document.getElementById('categoryTableBody');

    tbody.innerHTML = categories.map(cat => {
        const prodCount = products.filter(p => p.categoryId === cat.id).length;
        return `
            <tr>
                <td class="text-muted">#${cat.id}</td>
                <td>
                    <div class="bg-primary bg-opacity-10 text-primary rounded-3 d-flex align-items-center justify-content-center" style="width: 38px; height: 38px; font-size: 1.2rem;">
                        <i class="bi ${cat.icon}"></i>
                    </div>
                </td>
                <td class="fw-bold text-dark">${cat.name}</td>
                <td class="font-monospace small text-muted">${cat.slug}</td>
                <td class="small text-muted text-truncate" style="max-width: 300px;">${cat.description || '-'}</td>
                <td>
                    <span class="badge bg-light text-primary border fw-bold">${prodCount} Produk</span>
                </td>
                <td class="text-end">
                    <button type="button" class="btn btn-sm btn-outline-primary" onclick="openEditCategory(${cat.id})" title="Edit">
                        <i class="bi bi-pencil-square"></i>
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="deleteCategory(${cat.id}, '${cat.name.replace(/'/g, "\\'")}')" title="Hapus">
                        <i class="bi bi-trash3-fill"></i>
                    </button>
                </td>
            </tr>
        `;
    }).join('');
}

function openEditCategory(id) {
    const cat = TechDB.getCategoryById(id);
    if (!cat) return;
    document.getElementById('editCatId').value = cat.id;
    document.getElementById('editCatName').value = cat.name;
    document.getElementById('editCatIcon').value = cat.icon;
    document.getElementById('editCatDesc').value = cat.description || '';
    editModalInstance.show();
}

function deleteCategory(id, name) {
    if (confirm(`Apakah Anda yakin ingin menghapus kategori "${name}"?`)) {
        const res = TechDB.deleteCategory(id);
        if (res.success) {
            alert('Kategori berhasil dihapus!');
            renderCategories();
        } else {
            alert(res.message);
        }
    }
}
</script>
</body>
</html>
