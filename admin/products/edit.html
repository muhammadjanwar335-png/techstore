<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Data Produk - TechStore Admin</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>

<div class="admin-wrapper">
    <div id="adminSidebarContainer"></div>

    <div class="admin-main">
        <div id="adminTopbarContainer"></div>

        <main class="admin-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold mb-1"><i class="bi bi-pencil-square text-primary me-2"></i>Edit Data Produk</h3>
                    <p class="text-muted small mb-0">Ubah spesifikasi, harga jual, foto, dan persediaan stok barang.</p>
                </div>
                <a href="index.html" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i>Kembali
                </a>
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                <form id="editProductForm">
                    <div class="row g-4">
                        <div class="col-md-8">
                            <div class="mb-3">
                                <label class="form-label fw-semibold small text-secondary">Nama Produk / Aksesoris</label>
                                <input type="text" id="editName" class="form-control" required>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary">Kategori</label>
                                    <select id="editCategory" class="form-select" required>
                                        <option value="">-- Pilih Kategori --</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary">Harga Jual (Rp)</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light">Rp</span>
                                        <input type="number" id="editPrice" class="form-control" min="1000" step="500" required>
                                    </div>
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small text-secondary">Jumlah Stok</label>
                                    <input type="number" id="editStock" class="form-control" min="0" required>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small text-secondary">Berat (gram)</label>
                                    <input type="number" id="editWeight" class="form-control" min="1" required>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small text-secondary">Status Tayang</label>
                                    <select id="editStatus" class="form-select">
                                        <option value="active">Aktif (Dijual)</option>
                                        <option value="inactive">Nonaktif (Disembunyikan)</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold small text-secondary">Deskripsi & Spesifikasi Lengkap</label>
                                <textarea id="editDesc" class="form-control" rows="6" required></textarea>
                            </div>
                        </div>

                        <!-- Foto Produk -->
                        <div class="col-md-4">
                            <div class="border rounded-4 p-3 bg-light text-center h-100 d-flex flex-column justify-content-between">
                                <div>
                                    <h6 class="fw-bold mb-2">Foto Produk</h6>
                                    <div class="mb-3">
                                        <img id="editImagePreview" src="" alt="Preview" class="img-fluid rounded-3 border bg-white" style="max-height: 180px; width: 100%; object-fit: contain;">
                                    </div>

                                    <div class="mb-2 text-start">
                                        <label class="small fw-semibold text-secondary">Ganti Berkas Foto:</label>
                                        <input type="file" id="editImageFileInput" class="form-control form-control-sm" accept="image/*" onchange="handleEditFile(this)">
                                    </div>

                                    <div class="text-start">
                                        <label class="small fw-semibold text-secondary">Atau URL Foto:</label>
                                        <input type="url" id="editImageUrlInput" class="form-control form-control-sm" placeholder="https://..." onchange="handleEditUrl(this.value)">
                                    </div>
                                </div>

                                <div class="mt-4 pt-3 border-top d-grid gap-2">
                                    <button type="submit" class="btn btn-primary fw-bold py-2">
                                        <i class="bi bi-save me-1"></i>Simpan Perubahan
                                    </button>
                                    <a href="index.html" class="btn btn-light border py-2">Batal</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/db.js"></script>

<script>
let editingProductId = null;
let currentEditingImage = '';

document.addEventListener('DOMContentLoaded', function () {
    const admin = TechDB.requireAuth('admin', '../../auth/login.html');
    if (!admin) return;

    TechDB.renderAdminSidebar('adminSidebarContainer', 'products', '../../');
    TechDB.renderAdminTopbar('adminTopbarContainer', '../../');

    const params = new URLSearchParams(window.location.search);
    editingProductId = parseInt(params.get('id'));

    if (!editingProductId) {
        window.location.href = 'index.html';
        return;
    }

    const prod = TechDB.getProductById(editingProductId);
    if (!prod) {
        alert('Produk tidak ditemukan!');
        window.location.href = 'index.html';
        return;
    }

    const categories = TechDB.getCategories();
    const catSelect = document.getElementById('editCategory');
    categories.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.name;
        if (c.id === prod.categoryId) opt.selected = true;
        catSelect.appendChild(opt);
    });

    document.getElementById('editName').value = prod.name;
    document.getElementById('editPrice').value = prod.price;
    document.getElementById('editStock').value = prod.stock;
    document.getElementById('editWeight').value = prod.weight || 500;
    document.getElementById('editStatus').value = prod.status || 'active';
    document.getElementById('editDesc').value = prod.description;
    currentEditingImage = prod.image;
    document.getElementById('editImagePreview').src = prod.image;

    document.getElementById('editProductForm').addEventListener('submit', function (e) {
        e.preventDefault();

        const updatedData = {
            name: document.getElementById('editName').value.trim(),
            categoryId: parseInt(document.getElementById('editCategory').value),
            price: parseFloat(document.getElementById('editPrice').value),
            stock: parseInt(document.getElementById('editStock').value),
            weight: parseInt(document.getElementById('editWeight').value),
            status: document.getElementById('editStatus').value,
            description: document.getElementById('editDesc').value.trim(),
            image: currentEditingImage
        };

        TechDB.updateProduct(editingProductId, updatedData);
        alert(`Perubahan produk "${updatedData.name}" berhasil disimpan!`);
        window.location.href = 'index.html';
    });
});

function handleEditFile(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function (e) {
            currentEditingImage = e.target.result;
            document.getElementById('editImagePreview').src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
    }
}

function handleEditUrl(url) {
    if (url && url.trim().startsWith('http')) {
        currentEditingImage = url.trim();
        document.getElementById('editImagePreview').src = currentEditingImage;
    }
}
</script>
</body>
</html>
