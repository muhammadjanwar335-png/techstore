<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Produk Baru - TechStore Admin</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>

<div class="admin-wrapper">
    <div id="adminSidebarContainer"></div>

    <div class="admin-main">
        <div id="adminTopbarContainer"></div>

        <main class="admin-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold mb-1"><i class="bi bi-plus-circle text-primary me-2"></i>Tambah Produk Baru</h3>
                    <p class="text-muted small mb-0">Lengkapi formulir untuk mempublikasikan perlengkapan komputer ke katalog LocalStorage.</p>
                </div>
                <a href="index.html" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i>Kembali
                </a>
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                <form id="createProductForm">
                    <div class="row g-4">
                        <div class="col-md-8">
                            <div class="mb-3">
                                <label class="form-label fw-semibold small text-secondary">Nama Produk / Aksesoris</label>
                                <input type="text" id="prodName" class="form-control" placeholder="Contoh: Mechanical Keyboard RGB Wireless" required>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary">Kategori</label>
                                    <select id="prodCategory" class="form-select" required>
                                        <option value="">-- Pilih Kategori --</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-semibold small text-secondary">Harga Jual (Rp)</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light">Rp</span>
                                        <input type="number" id="prodPrice" class="form-control" placeholder="Contoh: 1450000" min="1000" step="500" required>
                                    </div>
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small text-secondary">Jumlah Stok</label>
                                    <input type="number" id="prodStock" class="form-control" value="10" min="0" required>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small text-secondary">Berat (gram)</label>
                                    <input type="number" id="prodWeight" class="form-control" value="500" min="1" required>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold small text-secondary">Status Tayang</label>
                                    <select id="prodStatus" class="form-select">
                                        <option value="active">Aktif (Dijual)</option>
                                        <option value="inactive">Nonaktif (Disembunyikan)</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold small text-secondary">Deskripsi & Spesifikasi Lengkap</label>
                                <textarea id="prodDesc" class="form-control" rows="6" placeholder="Ketikkan spesifikasi teknis, fitur unggulan, kelengkapan dalam paket, dan ketentuan garansi..." required></textarea>
                            </div>
                        </div>

                        <!-- Upload / URL Gambar -->
                        <div class="col-md-4">
                            <div class="border rounded-4 p-3 bg-light text-center h-100 d-flex flex-column justify-content-between">
                                <div>
                                    <h6 class="fw-bold mb-2">Foto Produk</h6>
                                    <p class="small text-muted mb-3">Pilih file gambar lokal atau masukkan URL foto</p>
                                    
                                    <div class="mb-3">
                                        <img id="imagePreview" src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=600&auto=format&fit=crop&q=80" alt="Preview Foto" class="img-fluid rounded-3 border bg-white" style="max-height: 180px; width: 100%; object-fit: contain;">
                                    </div>

                                    <div class="mb-2 text-start">
                                        <label class="small fw-semibold text-secondary">Pilih Berkas Foto:</label>
                                        <input type="file" id="imageFileInput" class="form-control form-control-sm" accept="image/*" onchange="handleImageFile(this)">
                                    </div>

                                    <div class="text-start">
                                        <label class="small fw-semibold text-secondary">Atau URL Gambar Web:</label>
                                        <input type="url" id="imageUrlInput" class="form-control form-control-sm" placeholder="https://..." onchange="handleImageUrl(this.value)">
                                    </div>
                                </div>

                                <div class="mt-4 pt-3 border-top d-grid gap-2">
                                    <button type="submit" class="btn btn-primary fw-bold py-2">
                                        <i class="bi bi-save me-1"></i>Simpan Produk
                                    </button>
                                    <a href="index.html" class="btn btn-light border py-2">Batal</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/db.js"></script>

<script>
let currentProductImage = 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=600&auto=format&fit=crop&q=80';

document.addEventListener('DOMContentLoaded', function () {
    const admin = TechDB.requireAuth('admin', '../../auth/login.html');
    if (!admin) return;

    TechDB.renderAdminSidebar('adminSidebarContainer', 'products', '../../');
    TechDB.renderAdminTopbar('adminTopbarContainer', '../../');

    const categories = TechDB.getCategories();
    const catSelect = document.getElementById('prodCategory');
    categories.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.name;
        catSelect.appendChild(opt);
    });

    document.getElementById('createProductForm').addEventListener('submit', function (e) {
        e.preventDefault();

        const newProd = {
            name: document.getElementById('prodName').value.trim(),
            categoryId: parseInt(document.getElementById('prodCategory').value),
            price: parseFloat(document.getElementById('prodPrice').value),
            stock: parseInt(document.getElementById('prodStock').value),
            weight: parseInt(document.getElementById('prodWeight').value),
            status: document.getElementById('prodStatus').value,
            description: document.getElementById('prodDesc').value.trim(),
            image: currentProductImage
        };

        TechDB.addProduct(newProd);
        alert(`Produk "${newProd.name}" berhasil ditambahkan ke katalog LocalStorage!`);
        window.location.href = 'index.html';
    });
});

function handleImageFile(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function (e) {
            currentProductImage = e.target.result;
            document.getElementById('imagePreview').src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
    }
}

function handleImageUrl(url) {
    if (url && url.trim().startsWith('http')) {
        currentProductImage = url.trim();
        document.getElementById('imagePreview').src = currentProductImage;
    }
}
</script>
</body>
</html>
