<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Data Produk - TechStore Admin</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>

<div class="admin-wrapper">
    <div id="adminSidebarContainer"></div>

    <div class="admin-main">
        <div id="adminTopbarContainer"></div>

        <main class="admin-content">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
                <div>
                    <h3 class="fw-bold mb-1"><i class="bi bi-box-seam text-primary me-2"></i>Manajemen Produk</h3>
                    <p class="text-muted small mb-0">Kelola inventaris hardware, aksesoris komputer, stok barang, dan harga jual.</p>
                </div>
                <div class="d-flex gap-2">
                    <a href="create.html" class="btn btn-primary btn-sm">
                        <i class="bi bi-plus-lg me-1"></i>Tambah Produk Baru
                    </a>
                </div>
            </div>

            <!-- Search & Filter Card -->
            <div class="card border-0 shadow-sm rounded-4 p-3 mb-4">
                <div class="row g-2 align-items-center">
                    <div class="col-md-5">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-search"></i></span>
                            <input type="text" id="adminSearchInput" class="form-control bg-light border-start-0" placeholder="Cari nama produk...">
                        </div>
                    </div>

                    <div class="col-md-4">
                        <select id="adminCategorySelect" class="form-select form-select-sm bg-light">
                            <option value="0">-- Semua Kategori --</option>
                        </select>
                    </div>

                    <div class="col-md-3 d-flex gap-2">
                        <button type="button" class="btn btn-primary btn-sm flex-fill" onclick="applyAdminFilters()">Terapkan</button>
                        <button type="button" class="btn btn-outline-secondary btn-sm" onclick="resetAdminFilters()" title="Reset Filter">
                            <i class="bi bi-arrow-counterclockwise"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Product Table -->
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="table-responsive">
                    <table class="table table-custom align-middle mb-0">
                        <thead>
                            <tr>
                                <th style="width: 50px;">No</th>
                                <th>Produk</th>
                                <th>Kategori</th>
                                <th>Harga</th>
                                <th>Stok</th>
                                <th>Status</th>
                                <th class="text-end" style="width: 140px;">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="adminProductsTableBody">
                            <!-- Diisi otomatis oleh JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/db.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const admin = TechDB.requireAuth('admin', '../../auth/login.html');
    if (!admin) return;

    const params = new URLSearchParams(window.location.search);
    const isLowStock = params.get('filter') === 'low_stock';

    TechDB.renderAdminSidebar('adminSidebarContainer', isLowStock ? 'low_stock' : 'products', '../../');
    TechDB.renderAdminTopbar('adminTopbarContainer', '../../');

    const categories = TechDB.getCategories();
    const catSelect = document.getElementById('adminCategorySelect');
    categories.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.name;
        catSelect.appendChild(opt);
    });

    if (isLowStock) {
        document.querySelector('h3').innerHTML = '<i class="bi bi-exclamation-triangle text-danger me-2"></i>Produk Stok Menipis (&lt; 5 Unit)';
    }

    applyAdminFilters();

    document.getElementById('adminSearchInput').addEventListener('input', applyAdminFilters);
    document.getElementById('adminCategorySelect').addEventListener('change', applyAdminFilters);
});

function applyAdminFilters() {
    const params = new URLSearchParams(window.location.search);
    const isLowStockOnly = params.get('filter') === 'low_stock';

    const q = document.getElementById('adminSearchInput').value.trim().toLowerCase();
    const catId = parseInt(document.getElementById('adminCategorySelect').value);

    let products = TechDB.getProducts();

    if (isLowStockOnly) {
        products = products.filter(p => p.stock < 5);
    }
    if (catId > 0) {
        products = products.filter(p => p.categoryId === catId);
    }
    if (q) {
        products = products.filter(p => p.name.toLowerCase().includes(q) || p.description.toLowerCase().includes(q));
    }

    const tbody = document.getElementById('adminProductsTableBody');
    if (products.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">Tidak ada produk yang sesuai dengan filter.</td></tr>`;
        return;
    }

    tbody.innerHTML = products.map((p, idx) => {
        const cat = TechDB.getCategoryById(p.categoryId) || {};
        let stockBadge = `<span class="badge bg-success">${p.stock} unit</span>`;
        if (p.stock <= 0) {
            stockBadge = `<span class="badge bg-danger">Habis (0)</span>`;
        } else if (p.stock < 5) {
            stockBadge = `<span class="badge bg-warning text-dark">Sisa ${p.stock} unit</span>`;
        }

        const statusBadge = p.status === 'active' 
            ? `<span class="badge bg-success-subtle text-success border border-success-subtle">Aktif</span>` 
            : `<span class="badge bg-secondary">Nonaktif</span>`;

        return `
            <tr>
                <td>${idx + 1}</td>
                <td>
                    <div class="d-flex align-items-center gap-3">
                        <img src="${p.image}" alt="${p.name}" class="rounded-3 border" style="width: 48px; height: 48px; object-fit: cover;">
                        <div>
                            <div class="fw-bold text-dark text-truncate" style="max-width: 280px;">${p.name}</div>
                            <small class="text-muted">Berat: ${p.weight || 500} gram</small>
                        </div>
                    </div>
                </td>
                <td><span class="badge bg-light text-dark border">${cat.name || 'Hardware'}</span></td>
                <td class="fw-bold text-primary">${TechDB.formatRupiah(p.price)}</td>
                <td>${stockBadge}</td>
                <td>${statusBadge}</td>
                <td class="text-end">
                    <a href="../../product-detail.html?id=${p.id}" target="_blank" class="btn btn-sm btn-light border" title="Lihat di Toko">
                        <i class="bi bi-box-arrow-up-right"></i>
                    </a>
                    <a href="edit.html?id=${p.id}" class="btn btn-sm btn-outline-primary" title="Edit">
                        <i class="bi bi-pencil-square"></i>
                    </a>
                    <button type="button" class="btn btn-sm btn-outline-danger" title="Hapus" onclick="handleDeleteProduct(${p.id}, '${p.name.replace(/'/g, "\\'")}')">
                        <i class="bi bi-trash3-fill"></i>
                    </button>
                </td>
            </tr>
        `;
    }).join('');
}

function resetAdminFilters() {
    document.getElementById('adminSearchInput').value = '';
    document.getElementById('adminCategorySelect').value = 0;
    applyAdminFilters();
}

function handleDeleteProduct(id, name) {
    if (confirm(`Apakah Anda yakin ingin menghapus produk "${name}"? Tindakan ini tidak dapat dibatalkan.`)) {
        TechDB.deleteProduct(id);
        alert('Produk berhasil dihapus dari sistem!');
        applyAdminFilters();
    }
}
</script>
</body>
</html>
