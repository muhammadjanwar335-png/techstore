<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Pelanggan - TechStore Admin</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>

<div class="admin-wrapper">
    <div id="adminSidebarContainer"></div>

    <div class="admin-main">
        <div id="adminTopbarContainer"></div>

        <main class="admin-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold mb-1"><i class="bi bi-person-badge text-primary me-2"></i>Detail Pelanggan</h3>
                    <p class="text-muted small mb-0">Informasi data diri dan riwayat belanja pelanggan.</p>
                </div>
                <a href="index.html" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i>Kembali
                </a>
            </div>

            <div class="row g-4 mb-4">
                <!-- Info Profil Card -->
                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm rounded-4 p-4 text-center">
                        <div class="bg-primary text-white rounded-circle mx-auto d-flex align-items-center justify-content-center fw-bold fs-2 mb-3" style="width: 72px; height: 72px;" id="custAvatarLetter">
                            C
                        </div>
                        <h5 class="fw-bold mb-1" id="custDetailName">-</h5>
                        <div class="text-muted small mb-3" id="custDetailEmail">-</div>

                        <hr>

                        <div class="text-start small">
                            <div class="mb-2">
                                <strong>No. Telepon / WA:</strong><br>
                                <span id="custDetailPhone">-</span>
                            </div>
                            <div class="mb-2">
                                <strong>Alamat Utama:</strong><br>
                                <span class="text-muted" id="custDetailAddress">-</span>
                            </div>
                            <div>
                                <strong>Bergabung Sejak:</strong><br>
                                <span class="text-muted" id="custDetailCreated">-</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Statistik & Riwayat Pesanan -->
                <div class="col-lg-8">
                    <div class="row g-3 mb-4">
                        <div class="col-sm-6">
                            <div class="card border-0 shadow-sm rounded-4 p-3 bg-white">
                                <div class="text-muted small">Total Pesanan Dibuat</div>
                                <div class="fs-4 fw-bold text-dark mt-1" id="custStatOrders">0 Transaksi</div>
                            </div>
                        </div>
                        <div class="col-sm-6">
                            <div class="card border-0 shadow-sm rounded-4 p-3 bg-white">
                                <div class="text-muted small">Total Pembelian Selesai</div>
                                <div class="fs-4 fw-bold text-success mt-1" id="custStatSpent">Rp 0</div>
                            </div>
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                        <div class="card-header bg-white border-bottom p-3 fw-bold">
                            <i class="bi bi-receipt text-primary me-2"></i>Daftar Transaksi Pelanggan
                        </div>
                        <div class="table-responsive">
                            <table class="table table-custom align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th>No. TRX</th>
                                        <th>Tanggal</th>
                                        <th>Total Tagihan</th>
                                        <th>Status Order</th>
                                        <th>Pembayaran</th>
                                        <th class="text-end">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="custOrdersTableBody">
                                    <!-- Diisi otomatis oleh JavaScript -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/db.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const admin = TechDB.requireAuth('admin', '../../auth/login.html');
    if (!admin) return;

    TechDB.renderAdminSidebar('adminSidebarContainer', 'customers', '../../');
    TechDB.renderAdminTopbar('adminTopbarContainer', '../../');

    const params = new URLSearchParams(window.location.search);
    const custId = parseInt(params.get('id'));

    if (!custId) {
        window.location.href = 'index.html';
        return;
    }

    const users = JSON.parse(localStorage.getItem(TechDB.KEYS.USERS) || '[]');
    const cust = users.find(u => u.id === custId);

    if (!cust) {
        alert('Data pelanggan tidak ditemukan!');
        window.location.href = 'index.html';
        return;
    }

    document.getElementById('custAvatarLetter').textContent = (cust.name || 'C').charAt(0).toUpperCase();
    document.getElementById('custDetailName').textContent = cust.name;
    document.getElementById('custDetailEmail').textContent = cust.email;
    document.getElementById('custDetailPhone').textContent = cust.phone || '-';
    document.getElementById('custDetailAddress').textContent = cust.address || '-';
    document.getElementById('custDetailCreated').textContent = TechDB.formatDate(cust.createdAt);

    const orders = TechDB.getTransactions(cust.id);
    const completed = orders.filter(o => o.status === 'completed');
    const totalSpent = completed.reduce((sum, o) => sum + o.grandTotal, 0);

    document.getElementById('custStatOrders').textContent = `${orders.length} Transaksi`;
    document.getElementById('custStatSpent').textContent = TechDB.formatRupiah(totalSpent);

    const tbody = document.getElementById('custOrdersTableBody');
    if (orders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">Pelanggan belum pernah melakukan transaksi.</td></tr>`;
    } else {
        tbody.innerHTML = orders.map(ord => `
            <tr>
                <td class="fw-bold font-monospace">${ord.transactionCode}</td>
                <td>${TechDB.formatDate(ord.createdAt)}</td>
                <td class="fw-bold text-primary">${TechDB.formatRupiah(ord.grandTotal)}</td>
                <td>${TechDB.getStatusBadge(ord.status)}</td>
                <td>${TechDB.getPaymentBadge(ord.paymentStatus)}</td>
                <td class="text-end">
                    <a href="../transactions/detail.html?id=${ord.id}" class="btn btn-sm btn-light border" title="Kelola">
                        <i class="bi bi-gear-fill"></i>
                    </a>
                    <a href="../../invoice/index.html?code=${ord.invoiceCode}" target="_blank" class="btn btn-sm btn-outline-dark" title="Invoice">
                        <i class="bi bi-receipt"></i>
                    </a>
                </td>
            </tr>
        `).join('');
    }
});
</script>
</body>
</html>
