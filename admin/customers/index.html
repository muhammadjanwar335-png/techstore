<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Pelanggan - TechStore Admin</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>

<div class="admin-wrapper">
    <div id="adminSidebarContainer"></div>

    <div class="admin-main">
        <div id="adminTopbarContainer"></div>

        <main class="admin-content">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
                <div>
                    <h3 class="fw-bold mb-1"><i class="bi bi-people text-primary me-2"></i>Data Pelanggan</h3>
                    <p class="text-muted small mb-0">Daftar pelanggan terdaftar, riwayat belanja, dan kontak pengiriman (LocalStorage).</p>
                </div>
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-3 mb-4">
                <div class="row g-2 align-items-center">
                    <div class="col-md-6">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-search"></i></span>
                            <input type="text" id="custSearchInput" class="form-control bg-light border-start-0" placeholder="Cari nama, email, atau no HP...">
                        </div>
                    </div>
                    <div class="col-md-2">
                        <button type="button" class="btn btn-primary btn-sm w-100" onclick="applyCustomerFilter()">Cari</button>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="table-responsive">
                    <table class="table table-custom align-middle mb-0">
                        <thead>
                            <tr>
                                <th style="width: 50px;">No</th>
                                <th>Pelanggan</th>
                                <th>Kontak & WhatsApp</th>
                                <th>Alamat Pengiriman</th>
                                <th>Total Pesanan</th>
                                <th>Total Belanja</th>
                                <th class="text-end" style="width: 100px;">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="customersTableBody">
                            <!-- Diisi otomatis oleh JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/js/db.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const admin = TechDB.requireAuth('admin', '../../auth/login.html');
    if (!admin) return;

    TechDB.renderAdminSidebar('adminSidebarContainer', 'customers', '../../');
    TechDB.renderAdminTopbar('adminTopbarContainer', '../../');

    renderCustomers();
    document.getElementById('custSearchInput').addEventListener('input', applyCustomerFilter);
});

function applyCustomerFilter() {
    renderCustomers();
}

function renderCustomers() {
    const q = document.getElementById('custSearchInput').value.trim().toLowerCase();
    const users = JSON.parse(localStorage.getItem(TechDB.KEYS.USERS) || '[]');
    let customers = users.filter(u => u.role === 'customer');
    const transactions = TechDB.getTransactions();

    if (q) {
        customers = customers.filter(c => 
            (c.name || '').toLowerCase().includes(q) || 
            (c.email || '').toLowerCase().includes(q) || 
            (c.phone || '').toLowerCase().includes(q)
        );
    }

    const tbody = document.getElementById('customersTableBody');
    if (customers.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">Tidak ada data pelanggan yang cocok.</td></tr>`;
        return;
    }

    tbody.innerHTML = customers.map((c, idx) => {
        const userTrans = transactions.filter(t => t.userId === c.id);
        const completedTrans = userTrans.filter(t => t.status === 'completed');
        const totalSpent = completedTrans.reduce((sum, t) => sum + t.grandTotal, 0);

        return `
            <tr>
                <td>${idx + 1}</td>
                <td>
                    <div class="d-flex align-items-center gap-2">
                        <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width: 36px; height: 36px; font-size: 13px;">
                            ${(c.name || 'C').charAt(0).toUpperCase()}
                        </div>
                        <div>
                            <div class="fw-bold text-dark">${c.name}</div>
                            <small class="text-muted">${c.email}</small>
                        </div>
                    </div>
                </td>
                <td>
                    <span class="badge bg-light text-dark border font-monospace">
                        <i class="bi bi-telephone me-1 text-success"></i>${c.phone || '-'}
                    </span>
                </td>
                <td class="small text-muted text-truncate" style="max-width: 260px;">
                    ${c.address || '-'}
                </td>
                <td>
                    <span class="badge bg-primary-subtle text-primary fw-bold">${userTrans.length} Pesanan</span>
                </td>
                <td class="fw-bold text-success">
                    ${TechDB.formatRupiah(totalSpent)}
                </td>
                <td class="text-end">
                    <a href="detail.html?id=${c.id}" class="btn btn-sm btn-outline-primary" title="Lihat Profil & Riwayat">
                        <i class="bi bi-eye-fill me-1"></i>Detail
                    </a>
                </td>
            </tr>
        `;
    }).join('');
}
</script>
</body>
</html>
