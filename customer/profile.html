<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan Profil - TechStore</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div id="navbarContainer"></div>

<main class="container py-4">
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a href="../index.html" class="text-decoration-none text-muted">Beranda</a></li>
            <li class="breadcrumb-item"><a href="dashboard.html" class="text-decoration-none text-muted">Dashboard</a></li>
            <li class="breadcrumb-item active" aria-current="page">Pengaturan Profil</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold fs-3" style="width: 56px; height: 56px;" id="profileAvatarLetter">
                        U
                    </div>
                    <div>
                        <h4 class="fw-bold mb-1" id="profileHeaderName">Nama Pelanggan</h4>
                        <div class="text-muted small"><span id="profileHeaderEmail">email@domain.com</span> &bull; Akun Pelanggan</div>
                    </div>
                </div>

                <form id="profileForm">
                    <h6 class="fw-bold text-secondary text-uppercase small mb-3">Informasi Pribadi & Kontak</h6>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Alamat Email (Tidak Dapat Diubah)</label>
                        <input type="email" id="profEmail" class="form-control bg-light" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Nama Lengkap</label>
                        <input type="text" id="profName" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Nomor Telepon / WhatsApp</label>
                        <input type="text" id="profPhone" class="form-control" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold text-secondary">Alamat Pengiriman Utama</label>
                        <textarea id="profAddress" class="form-control" rows="3" required></textarea>
                    </div>

                    <hr class="my-4">

                    <h6 class="fw-bold text-secondary text-uppercase small mb-3">Ganti Kata Sandi (Kosongkan jika tidak diubah)</h6>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary">Kata Sandi Baru</label>
                            <input type="password" id="profNewPass" class="form-control" placeholder="Minimal 6 karakter">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary">Ulangi Kata Sandi Baru</label>
                            <input type="password" id="profConfirmPass" class="form-control" placeholder="Konfirmasi kata sandi">
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="dashboard.html" class="btn btn-light border px-4">Batal</a>
                        <button type="submit" class="btn btn-primary px-4 fw-bold">
                            <i class="bi bi-check-circle me-1"></i>Simpan Perubahan
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<div id="footerContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/db.js"></script>

<script>
let currentUser = null;

document.addEventListener('DOMContentLoaded', function () {
    currentUser = TechDB.requireAuth('customer', '../auth/login.html');
    if (!currentUser) return;

    TechDB.renderNavbar('navbarContainer', '', '../');
    TechDB.renderFooter('footerContainer', '../');

    document.getElementById('profileAvatarLetter').textContent = (currentUser.name || 'U').charAt(0).toUpperCase();
    document.getElementById('profileHeaderName').textContent = currentUser.name;
    document.getElementById('profileHeaderEmail').textContent = currentUser.email;

    document.getElementById('profEmail').value = currentUser.email;
    document.getElementById('profName').value = currentUser.name;
    document.getElementById('profPhone').value = currentUser.phone || '';
    document.getElementById('profAddress').value = currentUser.address || '';

    document.getElementById('profileForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const name = document.getElementById('profName').value.trim();
        const phone = document.getElementById('profPhone').value.trim();
        const address = document.getElementById('profAddress').value.trim();
        const newPass = document.getElementById('profNewPass').value;
        const confirmPass = document.getElementById('profConfirmPass').value;

        const updateData = { name, phone, address };

        if (newPass) {
            if (newPass.length < 6) {
                alert('Kata sandi baru minimal 6 karakter!');
                return;
            }
            if (newPass !== confirmPass) {
                alert('Konfirmasi kata sandi baru tidak cocok!');
                return;
            }
            updateData.password = newPass;
        }

        TechDB.updateUserProfile(currentUser.id, updateData);
        alert('Profil berhasil diperbarui!');
        window.location.reload();
    });
});
</script>
</body>
</html>
