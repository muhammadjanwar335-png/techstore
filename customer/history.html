<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Transaksi - TechStore</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div id="navbarContainer"></div>

<main class="container py-4">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a href="../index.html" class="text-decoration-none text-muted">Beranda</a></li>
            <li class="breadcrumb-item"><a href="dashboard.html" class="text-decoration-none text-muted">Dashboard</a></li>
            <li class="breadcrumb-item active" aria-current="page">Riwayat Pesanan</li>
        </ol>
    </nav>

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4">
        <div>
            <h2 class="fw-bold mb-1"><i class="bi bi-clock-history text-primary me-2"></i>Riwayat Pesanan Saya</h2>
            <p class="text-muted small mb-0">Pantau status pemesanan, pembayaran, serta cetak invoice transaksi Anda</p>
        </div>
        <div class="mt-3 mt-md-0">
            <a href="products.html" class="btn btn-outline-primary btn-sm">
                <i class="bi bi-cart-plus me-1"></i>Belanja Lagi
            </a>
        </div>
    </div>

    <!-- Filter Pills -->
    <div class="d-flex gap-2 overflow-x-auto pb-3 mb-4" id="statusFilterPills" style="white-space: nowrap;">
        <button type="button" class="btn btn-sm btn-primary rounded-pill px-3" onclick="filterStatus('all', this)">Semua Pesanan</button>
        <button type="button" class="btn btn-sm btn-light border rounded-pill px-3" onclick="filterStatus('pending', this)">Menunggu Pembayaran</button>
        <button type="button" class="btn btn-sm btn-light border rounded-pill px-3" onclick="filterStatus('processing', this)">Sedang Diproses</button>
        <button type="button" class="btn btn-sm btn-light border rounded-pill px-3" onclick="filterStatus('shipped', this)">Sedang Dikirim</button>
        <button type="button" class="btn btn-sm btn-light border rounded-pill px-3" onclick="filterStatus('completed', this)">Selesai</button>
    </div>

    <!-- Empty State -->
    <div class="card border-0 shadow-sm rounded-4 p-5 text-center my-4 d-none" id="emptyHistoryCard">
        <div class="display-2 text-muted mb-3"><i class="bi bi-bag-x"></i></div>
        <h4 class="fw-bold mb-2">Belum Ada Transaksi</h4>
        <p class="text-muted mb-4">Anda belum memiliki riwayat pembelian barang untuk filter ini.</p>
        <div>
            <a href="products.html" class="btn btn-primary px-4 py-2">
                <i class="bi bi-grid-fill me-2"></i>Mulai Berbelanja
            </a>
        </div>
    </div>

    <!-- Transactions List Container -->
    <div class="d-flex flex-column gap-4" id="transactionsList">
        <!-- Diisi otomatis oleh JavaScript -->
    </div>
</main>

<div id="footerContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/db.js"></script>

<script>
let currentStatus = 'all';

document.addEventListener('DOMContentLoaded', function () {
    TechDB.renderNavbar('navbarContainer', '', '../');
    TechDB.renderFooter('footerContainer', '../');
    renderHistory();
});

function filterStatus(status, btn) {
    currentStatus = status;
    const buttons = document.querySelectorAll('#statusFilterPills button');
    buttons.forEach(b => {
        b.className = 'btn btn-sm btn-light border rounded-pill px-3';
    });
    btn.className = 'btn btn-sm btn-primary rounded-pill px-3';
    renderHistory();
}

function renderHistory() {
    const user = TechDB.getCurrentUser();
    let transactions = TechDB.getTransactions(user ? user.id : null);

    if (currentStatus !== 'all') {
        transactions = transactions.filter(t => t.status === currentStatus);
    }

    const emptyCard = document.getElementById('emptyHistoryCard');
    const container = document.getElementById('transactionsList');

    if (transactions.length === 0) {
        emptyCard.classList.remove('d-none');
        container.innerHTML = '';
        return;
    }

    emptyCard.classList.add('d-none');
    container.innerHTML = transactions.map(t => {
        const isPaid = t.paymentStatus === 'paid';
        const isPendingPay = t.paymentStatus === 'pending';
        const totalItemsCount = (t.items || []).reduce((acc, it) => acc + it.quantity, 0);

        return `
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-header bg-light border-bottom p-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
                    <div class="d-flex flex-wrap align-items-center gap-3">
                        <span class="fw-bold text-dark font-monospace">${t.transactionCode}</span>
                        <span class="text-muted small">&bull; ${TechDB.formatDate(t.createdAt, true)}</span>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        ${TechDB.getStatusBadge(t.status)}
                        ${TechDB.getPaymentBadge(t.paymentStatus)}
                    </div>
                </div>

                <div class="card-body p-4">
                    <div class="row align-items-center g-3">
                        <div class="col-md-5">
                            <div class="text-secondary small mb-1">Penerima & Alamat:</div>
                            <div class="fw-bold text-dark">${t.recipientName} (${t.recipientPhone})</div>
                            <div class="text-muted small text-truncate" style="max-width: 320px;">${t.shippingAddress}</div>
                            <div class="mt-2 text-secondary small">
                                <i class="bi bi-truck text-primary me-1"></i>Ekspedisi: <strong>${t.shippingCourier}</strong>
                            </div>
                        </div>

                        <div class="col-md-3">
                            <div class="text-secondary small mb-1">Metode & Total:</div>
                            <div class="small fw-semibold">${t.paymentMethod}</div>
                            <div class="fs-5 fw-extrabold text-primary">${TechDB.formatRupiah(t.grandTotal)}</div>
                            <small class="text-muted">${(t.items || []).length} macam barang (${totalItemsCount} unit)</small>
                        </div>

                        <div class="col-md-4 text-md-end d-flex flex-column gap-2 justify-content-center">
                            <div class="d-flex flex-wrap justify-content-md-end gap-2">
                                ${isPendingPay ? `
                                    <a href="payment.html?trx=${t.transactionCode}" class="btn btn-warning btn-sm fw-bold">
                                        <i class="bi bi-wallet2 me-1"></i>Bayar Sekarang
                                    </a>
                                ` : ''}

                                <a href="order-detail.html?code=${t.transactionCode}" class="btn btn-outline-primary btn-sm">
                                    <i class="bi bi-eye me-1"></i>Rincian
                                </a>

                                <a href="../invoice/index.html?code=${t.invoiceCode}" class="btn btn-outline-dark btn-sm" title="Lihat Invoice">
                                    <i class="bi bi-receipt me-1"></i>Invoice
                                </a>

                                <a href="../invoice/struk.html?code=${t.invoiceCode}" target="_blank" class="btn btn-light border btn-sm" title="Cetak Struk Kasir">
                                    <i class="bi bi-printer"></i>
                                </a>
                            </div>
                        </div>
                    </div>

                    <!-- Progress Stepper -->
                    <div class="mt-4 pt-3 border-top">
                        <div class="row text-center text-secondary small g-1">
                            <div class="col-3 ${['pending', 'processing', 'shipped', 'completed'].includes(t.status) ? 'text-primary fw-bold' : ''}">
                                <i class="bi bi-check-circle-fill"></i> Dipesan
                            </div>
                            <div class="col-3 ${['processing', 'shipped', 'completed'].includes(t.status) ? 'text-primary fw-bold' : ''}">
                                <i class="bi ${['processing', 'shipped', 'completed'].includes(t.status) ? 'bi-check-circle-fill' : 'bi-circle'}"></i> Diproses
                            </div>
                            <div class="col-3 ${['shipped', 'completed'].includes(t.status) ? 'text-primary fw-bold' : ''}">
                                <i class="bi ${['shipped', 'completed'].includes(t.status) ? 'bi-check-circle-fill' : 'bi-circle'}"></i> Dikirim
                            </div>
                            <div class="col-3 ${t.status === 'completed' ? 'text-success fw-bold' : ''}">
                                <i class="bi ${t.status === 'completed' ? 'bi-check-circle-fill' : 'bi-circle'}"></i> Selesai
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }).join('');
}
</script>
</body>
</html>
