<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran Pesanan - TechStore</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div id="navbarContainer"></div>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <!-- Header Tagihan Card -->
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-4">
                <div class="p-4 text-white" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);">
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                        <div>
                            <span class="badge bg-primary px-3 py-2 rounded-pill mb-2">Instruksi Pembayaran</span>
                            <h4 class="fw-bold mb-1" id="displayTrxCode">Kode Transaksi: -</h4>
                            <small class="text-secondary" id="displayTrxDate">Dibuat pada: -</small>
                        </div>
                        <div class="text-md-end">
                            <div class="text-secondary small">Total Tagihan:</div>
                            <div class="fs-2 fw-extrabold text-info" id="displayGrandTotal">Rp 0</div>
                        </div>
                    </div>
                </div>

                <div class="card-body p-4">
                    <!-- Status Alert Banner -->
                    <div class="d-flex align-items-center justify-content-between p-3 rounded-3 bg-light border mb-4">
                        <div class="d-flex align-items-center gap-2">
                            <span class="fw-bold small text-secondary">Status Pembayaran:</span>
                            <span id="displayPaymentBadge"></span>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <span class="fw-bold small text-secondary">Metode:</span>
                            <span class="badge bg-dark" id="displayPaymentMethod">-</span>
                        </div>
                    </div>

                    <!-- Area Dinamis Berdasarkan Status Pembayaran -->
                    <div id="paymentContentArea">
                        <!-- Diisi otomatis oleh JavaScript -->
                    </div>

                    <!-- Action Links -->
                    <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                        <a href="history.html" class="text-decoration-none text-secondary small">
                            <i class="bi bi-arrow-left me-1"></i>Ke Riwayat Pesanan
                        </a>
                        <a href="#" id="viewInvoiceLink" class="text-decoration-none text-primary small fw-semibold">
                            Lihat Draft Faktur (Invoice) &rarr;
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div id="footerContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/db.js"></script>

<script>
let currentTrx = null;

document.addEventListener('DOMContentLoaded', function () {
    TechDB.renderNavbar('navbarContainer', '', '../');
    TechDB.renderFooter('footerContainer', '../');

    const params = new URLSearchParams(window.location.search);
    const trxCode = params.get('trx');

    if (!trxCode) {
        window.location.href = 'history.html';
        return;
    }

    currentTrx = TechDB.getTransactionByCode(trxCode);
    if (!currentTrx) {
        alert('Transaksi tidak ditemukan!');
        window.location.href = 'history.html';
        return;
    }

    renderPaymentView();
});

function renderPaymentView() {
    document.title = `Pembayaran ${currentTrx.transactionCode} - TechStore`;
    document.getElementById('displayTrxCode').textContent = `Kode: ${currentTrx.transactionCode}`;
    document.getElementById('displayTrxDate').textContent = `Dibuat pada: ${TechDB.formatDate(currentTrx.createdAt, true)}`;
    document.getElementById('displayGrandTotal').textContent = TechDB.formatRupiah(currentTrx.grandTotal);
    document.getElementById('displayPaymentBadge').innerHTML = TechDB.getPaymentBadge(currentTrx.paymentStatus);
    document.getElementById('displayPaymentMethod').textContent = currentTrx.paymentMethod;
    document.getElementById('viewInvoiceLink').href = `../invoice/index.html?code=${currentTrx.invoiceCode}`;

    const area = document.getElementById('paymentContentArea');

    // 1. JIKA SUDAH LUNAS (PAID)
    if (currentTrx.paymentStatus === 'paid') {
        area.innerHTML = `
            <div class="text-center py-4">
                <div class="display-3 text-success mb-3"><i class="bi bi-patch-check-fill"></i></div>
                <h3 class="fw-bold text-success mb-2">Pembayaran Berhasil Diterima!</h3>
                <p class="text-muted mb-4">
                    Terima kasih, simulasi transaksi Anda telah terverifikasi lunas. Pesanan siap dipersiapkan oleh tim logistik TechStore.
                </p>
                <div class="d-flex flex-wrap justify-content-center gap-2">
                    <a href="../invoice/index.html?code=${currentTrx.invoiceCode}" class="btn btn-primary px-4 py-2">
                        <i class="bi bi-receipt me-2"></i>Lihat & Cetak Faktur (Invoice)
                    </a>
                    <a href="../invoice/struk.html?code=${currentTrx.invoiceCode}" target="_blank" class="btn btn-outline-dark px-3 py-2">
                        <i class="bi bi-printer me-2"></i>Cetak Struk Kasir
                    </a>
                    <a href="history.html" class="btn btn-light border px-4 py-2">
                        <i class="bi bi-arrow-left me-2"></i>Riwayat Pesanan
                    </a>
                </div>
            </div>
        `;
        return;
    }

    // 2. JIKA STATUS GAGAL (FAILED)
    if (currentTrx.paymentStatus === 'failed') {
        area.innerHTML = `
            <div class="alert alert-danger p-4 text-center rounded-3 mb-4">
                <i class="bi bi-x-octagon-fill display-4 text-danger mb-2 d-block"></i>
                <h5 class="fw-bold">Pembayaran Ditolak atau Dibatalkan</h5>
                <p class="small text-muted mb-3">Catatan: ${currentTrx.notes || 'Bukti transfer tidak valid atau simulasi dibatalkan oleh admin.'}</p>
                <a href="history.html" class="btn btn-outline-danger btn-sm">Kembali ke Riwayat Pesanan</a>
            </div>
        `;
        return;
    }

    // 3. JIKA STATUS MASIH PENDING
    let methodSection = '';

    // A. TRANSFER BANK
    if (currentTrx.paymentMethod.includes('Transfer Bank')) {
        methodSection = `
            <div class="border rounded-4 p-4 mb-4 bg-light">
                <h6 class="fw-bold mb-3 text-dark"><i class="bi bi-bank text-primary me-2"></i>Nomor Rekening Tujuan:</h6>
                
                <div class="card p-3 mb-3 border bg-white">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <span class="badge bg-primary mb-1">Bank BCA</span>
                            <div class="fs-4 fw-bold font-monospace text-dark">8830 1234 5678</div>
                            <small class="text-muted">Atas Nama: <strong>PT TECHSTORE INDONESIA</strong></small>
                        </div>
                        <button class="btn btn-outline-secondary btn-sm" onclick="navigator.clipboard.writeText('883012345678'); alert('Nomor rekening BCA berhasil disalin!');">
                            <i class="bi bi-clipboard me-1"></i>Salin
                        </button>
                    </div>
                </div>

                <div class="card p-3 border bg-white mb-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <span class="badge bg-secondary mb-1">Bank Mandiri</span>
                            <div class="fs-4 fw-bold font-monospace text-dark">127 000 987 6543</div>
                            <small class="text-muted">Atas Nama: <strong>PT TECHSTORE INDONESIA</strong></small>
                        </div>
                        <button class="btn btn-outline-secondary btn-sm" onclick="navigator.clipboard.writeText('1270009876543'); alert('Nomor rekening Mandiri berhasil disalin!');">
                            <i class="bi bi-clipboard me-1"></i>Salin
                        </button>
                    </div>
                </div>

                <h6 class="fw-bold mt-4 mb-2 text-dark"><i class="bi bi-upload text-primary me-2"></i>Upload Bukti Transfer Bank:</h6>
                <p class="small text-muted mb-3">Format JPG, PNG, atau WebP. Bukti ini akan tersimpan di LocalStorage dan diverifikasi oleh Admin.</p>

                ${currentTrx.paymentProof ? `
                    <div class="alert alert-info d-flex align-items-center small py-2 mb-3">
                        <i class="bi bi-check-circle-fill text-info fs-5 me-2"></i>
                        <div>Bukti transfer sudah diunggah. Menunggu verifikasi admin. Anda dapat mengunggah ulang jika ingin mengganti.</div>
                    </div>
                ` : ''}

                <div class="mb-3">
                    <input type="file" id="proofFileInput" class="form-control" accept="image/*" onchange="previewProof(this)">
                </div>
                <div class="mb-3 text-center d-none" id="previewContainer">
                    <img id="proofPreviewImg" src="#" alt="Preview" class="img-fluid rounded-3 border" style="max-height: 250px;">
                </div>
                <button type="button" class="btn btn-primary w-100 py-2 fw-bold" onclick="submitProofUpload()">
                    <i class="bi bi-cloud-arrow-up-fill me-2"></i>Kirim Bukti Pembayaran
                </button>
            </div>
        `;
    }
    // B. QRIS
    else if (currentTrx.paymentMethod === 'QRIS') {
        methodSection = `
            <div class="text-center border rounded-4 p-4 mb-4 bg-light">
                <span class="badge bg-success px-3 py-2 rounded-pill mb-2">QRIS Standar Nasional</span>
                <h5 class="fw-bold mb-1">Pindai Kode QRIS di Bawah Ini</h5>
                <p class="small text-muted mb-4">Gunakan aplikasi BCA Mobile, GoPay, OVO, DANA, Livin, atau ShopeePay</p>

                <div class="bg-white p-3 rounded-4 d-inline-block border shadow-sm mb-3">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=TECHSTORE-PAY-${encodeURIComponent(currentTrx.transactionCode)}-AMT-${Math.round(currentTrx.grandTotal)}" alt="QRIS Code" class="img-fluid" style="width: 220px; height: 220px;">
                    <div class="fw-bold text-dark mt-2 small">NMID: ID1020304050607</div>
                </div>

                <div class="alert alert-info border-0 small text-start mb-4">
                    <i class="bi bi-info-circle-fill text-primary me-2"></i>
                    <strong>Simulasi Demonstrasi Tugas Kuliah:</strong><br>
                    Klik tombol konfirmasi simulasi di bawah untuk menguji alur saat pembayaran dinyatakan berhasil secara instan dan data disimpan ke LocalStorage.
                </div>

                <button type="button" class="btn btn-success btn-lg px-4 py-3 fw-bold w-100 shadow-sm" onclick="simulatePaymentSuccess()">
                    <i class="bi bi-lightning-charge-fill me-2"></i>Simulasi Bayar Sekarang (Instan Lunas)
                </button>
            </div>
        `;
    }
    // C. E-WALLET (DANA, OVO, GoPay)
    else if (['DANA', 'OVO', 'GoPay'].includes(currentTrx.paymentMethod)) {
        methodSection = `
            <div class="border rounded-4 p-4 mb-4 bg-light text-center">
                <h5 class="fw-bold mb-2">Pembayaran via ${currentTrx.paymentMethod}</h5>
                <p class="small text-muted mb-4">Nomor virtual / nomor terdaftar akun e-wallet Anda</p>

                <div class="card p-3 border bg-white mb-4 text-start">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="text-muted small">Nomor Merchant:</span>
                        <strong class="font-monospace text-primary">0812-3456-7890 (TechStore)</strong>
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="text-muted small">Total Tagihan:</span>
                        <strong class="text-dark fs-5">${TechDB.formatRupiah(currentTrx.grandTotal)}</strong>
                    </div>
                </div>

                <button type="button" class="btn btn-primary btn-lg px-4 py-3 fw-bold w-100 shadow-sm" onclick="simulatePaymentSuccess()">
                    <i class="bi bi-check-circle-fill me-2"></i>Simulasi Bayar via ${currentTrx.paymentMethod}
                </button>
            </div>
        `;
    }
    // D. COD
    else {
        methodSection = `
            <div class="border rounded-4 p-4 mb-4 bg-light text-center">
                <i class="bi bi-cash-coin display-3 text-warning mb-2 d-inline-block"></i>
                <h5 class="fw-bold mb-2">Metode COD (Cash on Delivery)</h5>
                <p class="text-muted small mb-4">
                    Pesanan Anda telah dicatat dan akan segera diproses. Siapkan uang pas sebesar <strong>${TechDB.formatRupiah(currentTrx.grandTotal)}</strong> saat kurir mengantarkan barang ke alamat Anda.
                </p>
                <a href="history.html" class="btn btn-primary px-4 py-2">
                    <i class="bi bi-box-seam me-2"></i>Pantau Status Pesanan
                </a>
            </div>
        `;
    }

    area.innerHTML = `
        <div class="alert alert-warning border-0 d-flex align-items-center justify-content-between p-3 mb-4">
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-hourglass-top fs-4 text-warning"></i>
                <div>
                    <div class="fw-bold small">Batas Waktu Pembayaran:</div>
                    <small class="text-muted">Selesaikan pembayaran sebelum batas waktu berakhir</small>
                </div>
            </div>
            <div class="fw-bold fs-5 text-danger font-monospace" id="countdownTimer">23:59:45</div>
        </div>
        ${methodSection}
    `;

    startCountdown();
}

function startCountdown() {
    let seconds = 86385;
    const el = document.getElementById('countdownTimer');
    if (!el) return;
    const interval = setInterval(() => {
        if (seconds > 0) {
            seconds--;
            const h = String(Math.floor(seconds / 3600)).padStart(2, '0');
            const m = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
            const s = String(seconds % 60).padStart(2, '0');
            el.textContent = `${h}:${m}:${s}`;
        } else {
            clearInterval(interval);
        }
    }, 1000);
}

let uploadedProofBase64 = null;

function previewProof(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function (e) {
            uploadedProofBase64 = e.target.result;
            const preview = document.getElementById('proofPreviewImg');
            preview.src = e.target.result;
            document.getElementById('previewContainer').classList.remove('d-none');
        };
        reader.readAsDataURL(input.files[0]);
    }
}

function submitProofUpload() {
    if (!uploadedProofBase64) {
        alert('Silakan pilih file gambar bukti transfer terlebih dahulu!');
        return;
    }
    TechDB.verifyPayment(currentTrx.id, 'pending', 'Bukti transfer diunggah oleh pelanggan, menunggu verifikasi admin.', uploadedProofBase64);
    alert('Bukti transfer berhasil disimpan di sistem! Admin dapat memverifikasinya melalui menu Verifikasi Pembayaran.');
    currentTrx = TechDB.getTransactionByCode(currentTrx.transactionCode);
    renderPaymentView();
}

function simulatePaymentSuccess() {
    TechDB.verifyPayment(currentTrx.id, 'paid', 'Pembayaran terkonfirmasi otomatis via simulasi demonstrasi.');
    currentTrx = TechDB.getTransactionByCode(currentTrx.transactionCode);
    alert('Simulasi pembayaran sukses! Status pesanan berubah menjadi DIPROSES.');
    renderPaymentView();
}
</script>
</body>
</html>
