<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun Baru - TechStore</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #090d16 0%, #0f172a 60%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
            max-width: 650px;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="auth-card p-4 p-md-5">
    <div class="text-center mb-4">
        <a href="../index.html" class="navbar-brand-tech text-dark fs-3 mb-2 d-inline-block">
            <i class="bi bi-cpu-fill text-primary"></i> TECH<span class="text-primary">STORE</span>
        </a>
        <h3 class="fw-bold mb-1">Pendaftaran Akun Baru</h3>
        <p class="text-muted small">Lengkapi data diri Anda untuk mulai berbelanja di TechStore</p>
    </div>

    <div id="registerAlert" class="alert alert-danger d-none align-items-center small py-2 mb-3">
        <i class="bi bi-exclamation-triangle-fill fs-5 me-2"></i>
        <span id="registerAlertText"></span>
    </div>

    <form id="registerForm">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label fw-semibold small text-secondary">Nama Lengkap</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" id="regName" class="form-control bg-light" placeholder="Contoh: Dimas Pratama" required>
                </div>
            </div>

            <div class="col-md-6">
                <label class="form-label fw-semibold small text-secondary">Alamat Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="regEmail" class="form-control bg-light" placeholder="nama@email.com" required>
                </div>
            </div>

            <div class="col-md-6">
                <label class="form-label fw-semibold small text-secondary">Kata Sandi</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" id="regPassword" class="form-control bg-light" placeholder="Minimal 6 karakter" required>
                </div>
            </div>

            <div class="col-md-6">
                <label class="form-label fw-semibold small text-secondary">Konfirmasi Kata Sandi</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-shield-check"></i></span>
                    <input type="password" id="regConfirmPassword" class="form-control bg-light" placeholder="Ulangi kata sandi" required>
                </div>
            </div>

            <div class="col-12">
                <label class="form-label fw-semibold small text-secondary">No. WhatsApp / Telepon</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-phone"></i></span>
                    <input type="text" id="regPhone" class="form-control bg-light" placeholder="Contoh: 081234567890" required>
                </div>
            </div>

            <div class="col-12">
                <label class="form-label fw-semibold small text-secondary">Alamat Lengkap Pengiriman</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-geo-alt"></i></span>
                    <textarea id="regAddress" class="form-control bg-light" rows="2" placeholder="Nama jalan, nomor rumah, RT/RW, kecamatan, kota/kabupaten" required></textarea>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 mt-4 fw-bold shadow-sm">
            <i class="bi bi-person-check-fill me-2"></i>Daftar Sekarang
        </button>
    </form>

    <div class="mt-4 text-center small text-muted">
        Sudah memiliki akun? <a href="login.html" class="fw-bold text-primary">Masuk di sini</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/db.js"></script>

<script>
document.getElementById('registerForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const confirmPassword = document.getElementById('regConfirmPassword').value;
    const phone = document.getElementById('regPhone').value.trim();
    const address = document.getElementById('regAddress').value.trim();

    const alertBox = document.getElementById('registerAlert');
    const alertText = document.getElementById('registerAlertText');

    if (password.length < 6) {
        alertText.textContent = 'Kata sandi minimal 6 karakter!';
        alertBox.classList.remove('d-none');
        alertBox.classList.add('d-flex');
        return;
    }

    if (password !== confirmPassword) {
        alertText.textContent = 'Konfirmasi kata sandi tidak cocok!';
        alertBox.classList.remove('d-none');
        alertBox.classList.add('d-flex');
        return;
    }

    const res = TechDB.registerCustomer({ name, email, password, phone, address });
    if (res.success) {
        alert('Pendaftaran akun berhasil! Silakan masuk dengan email dan kata sandi Anda.');
        window.location.href = 'login.html';
    } else {
        alertText.textContent = res.message;
        alertBox.classList.remove('d-none');
        alertBox.classList.add('d-flex');
    }
});
</script>
</body>
</html>
